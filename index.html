<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yiran Shu — Film Archive</title>
    <meta name="description" content="Interactive 3D film archive portfolio for Yiran Shu." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="archive-page">
      <header class="archive-header">
        <h1 class="artist-name">Yiran Shu</h1>
        <p class="archive-titles" id="archiveTitles"></p>
      </header>

      <main class="archive-viewport" id="archiveViewport">
        <canvas
          id="archiveCanvas"
          data-card-set="home"
          aria-label="3D film archive"
        ></canvas>
      </main>

      <footer class="archive-footer">
        <a href="https://www.instagram.com/yiranshu/" target="_blank" rel="noreferrer">Instagram</a>
        <span>·</span>
        <a href="https://www.youtube.com/@yiranshu11" target="_blank" rel="noreferrer">YouTube</a>
      </footer>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
